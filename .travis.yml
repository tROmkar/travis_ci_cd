language: shell

script:
  - |
    echo "Triggering testRigor..."

    RANDOM_BRANCH="qa-$(date +%Y%m%d%H%M%S)"
    RANDOM_COMMIT="$(printf '%s' "$(date +%s)-$RANDOM" | sha1sum | cut -c1-12)"

    echo "Branch: $RANDOM_BRANCH"
    echo "Commit: $RANDOM_COMMIT"

    curl -X POST \
      -H "Content-type: application/json" \
      -H "auth-token: $TESTRIGOR_AUTH_TOKEN" \
      --data "{
        \"branch\": {
          \"name\": \"$RANDOM_BRANCH\",
          \"commit\": \"$RANDOM_COMMIT\"
        },
        \"url\": \"https://google.com\",
        \"storedValues\": {
          \"storedValueName1\": \"Value\"
        },
        \"customName\": \"Travis CI Run - $RANDOM_BRANCH\"
      }" \
      https://api.testrigor.com/api/v1/apps/FNSnDZ5BH7bTHcG7e/retest
